[package]
name = "rust_lib_spatial_audio_sandbox"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[workspace]
members = ["engine"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
sas_engine = { path = "engine" }
anyhow = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# flutter run builds dev — without this, symphonia decodes mp3
# unoptimized (~50x slower) and the DSP falls behind on-device.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
