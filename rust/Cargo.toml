[package]
name = "rust_lib_spatial_audio_sandbox"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[workspace]
members = ["engine"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
sas_engine = { path = "engine" }
anyhow = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
